[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pasta_signals"
version = "0.1.0"
description = "Paired Air and Stream Temperature Analysis (PASTA) at the annual and diel scales"
readme = "README.md"
authors = [{ name = "Danielle Hare" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.0", "pyarrow>=14.0"]
test = ["pytest"]

[project.scripts]
pasta-signals = "pasta_signals.__main__:main"

[tool.setuptools]
packages = ["pasta_signals"]
